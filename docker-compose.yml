# HUMANUM CONSULTING — pile complète : PostgreSQL, Redis, API, worker, interface.
# Base et Redis ne sont pas exposés sur la machine (aucun conflit avec un PostgreSQL ou un Redis local).
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: humanum }
    volumes: ["pgdata:/var/lib/postgresql/data", "./backend/scripts/bootstrap_db.sql:/docker-entrypoint-initdb.d/00_bootstrap.sql:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  redis:
    image: redis:7
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      HC_DATABASE_URL: postgresql+asyncpg://humanum_app:humanum_app@db:5432/humanum
      HC_DATABASE_OWNER_URL: postgresql+asyncpg://postgres:postgres@db:5432/humanum
      HC_DATABASE_PLATFORM_URL: postgresql+asyncpg://humanum_platform:humanum_platform@db:5432/humanum
      HC_REDIS_URL: redis://redis:6379/0
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    ports: ["8000:8000"]
  worker:  # file de tâches Arq : ingestion Fathom, synthèses, rappels (lots suivants)
    build: ./backend
    env_file: ./backend/.env
    environment:
      HC_DATABASE_URL: postgresql+asyncpg://humanum_app:humanum_app@db:5432/humanum
      HC_DATABASE_PLATFORM_URL: postgresql+asyncpg://humanum_platform:humanum_platform@db:5432/humanum
      HC_REDIS_URL: redis://redis:6379/0
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  web:
    build: { context: ./frontend, args: { HC_API_URL: "http://api:8000" } }
    environment: { HC_API_URL: "http://api:8000" }
    depends_on: [api]
    ports: ["3000:3000"]
volumes: { pgdata: {} }
