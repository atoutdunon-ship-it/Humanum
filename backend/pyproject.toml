[project]
name = "humanum-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0.36", "asyncpg>=0.30",
  "alembic>=1.14", "pydantic>=2.9", "pydantic-settings>=2.6", "email-validator>=2.2",
  "argon2-cffi>=23.1", "pyjwt>=2.9", "httpx>=0.27",
  "pyotp>=2.9", "segno>=1.6", "cryptography>=43", "redis>=5.0", "arq>=0.26",
]
[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["B008", "E501", "UP017"]  # B008 : idiome FastAPI Depends()

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107", "S603", "S607"]
"migrations/*" = ["S608"]  # SQL des politiques RLS : constantes, aucune entrée utilisateur
"app/core/config.py" = ["S105", "S106"]  # valeurs de développement, surchargées par l'environnement
"app/api/routes/auth.py" = ["S105", "S106"]
